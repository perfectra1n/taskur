services:
  postgres:
    image: postgres:17
    container_name: taskur-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskur
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: taskur-backend-dev
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/taskur
      JWT_SECRET: dev-secret-key
      RUST_LOG: debug
      HOST: 0.0.0.0
      PORT: 8080
      CARGO_TARGET_DIR: /app/target
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/migrations:/app/migrations
      - ./backend/Cargo.toml:/app/Cargo.toml
      - backend_target:/app/target
      - backend_cargo_registry:/usr/local/cargo/registry
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    container_name: taskur-frontend-dev
    environment:
      VITE_API_URL: http://backend:8080
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tsconfig.app.json:/app/tsconfig.app.json
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js
      - ./frontend/node_modules:/app/node_modules
      - ./node_modules:/node_modules
    restart: unless-stopped

volumes:
  postgres_dev_data:
  backend_target:
  backend_cargo_registry:
